name: Bug Report
description: Create a report to help us improve Air-Gapped RAG
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A concise summary of what went wrong.
      placeholder: "e.g., PDF extraction fails on scanned tables without text layers"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps to reproduce the behavior.
      placeholder: |
        1. Start backend with `uvicorn app.main:app`
        2. Upload document using `/api/v1/documents/upload`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      options:
        - Backend (FastAPI / PyMuPDF)
        - Vector DB (LanceDB)
        - Local LLM / Ollama
        - Frontend (Next.js / UI)
        - Documentation / CI
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS version, Python version, Node version, Ollama model, etc.
      placeholder: "macOS 15.0 / Python 3.12 / pnpm 10.19 / Ollama nomic-embed-text"
